name: Barcode v2 checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: food-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  barcode-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/barcode-v2.test.cjs
      - run: node tests/ui-scale.test.cjs
      - run: node tests/food-browser.test.cjs
      - run: node tests/food-layout.browser.test.cjs
      - run: node tests/full-v2.test.cjs
      - run: node tests/food-v2-offline.test.cjs
      - run: node tests/v2-interface.browser.test.cjs
