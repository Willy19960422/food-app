<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食養紀錄 · 雲端同步版</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#EDF3F0;--card:#fff;--ink:#12302B;--mute:#5F7A73;--line:#D3E0DB;--brand:#0F5C4F;--on:#fff;--kcal:#E8961E;--pro:#2F6FD0;--fat:#C0508A;--carb:#3E9B5B;--warn:#B3402A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A17;--card:#172924;--ink:#E4F1EC;--mute:#8FAAA2;--line:#284039;--brand:#4FC3AB;--on:#06201B}}
:root[data-theme="dark"]{--bg:#0E1A17;--card:#172924;--ink:#E4F1EC;--mute:#8FAAA2;--line:#284039;--brand:#4FC3AB;--on:#06201B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;padding-bottom:76px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.ring{display:flex;align-items:center;gap:16px}
.big{font-size:34px;font-weight:700;line-height:1.1}.mute{color:var(--mute);font-size:14px}
.bar{margin:10px 0}.bar .t{display:flex;justify-content:space-between;font-size:14px}
.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:6px;transition:width .4s}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:500;padding:12px 16px;border-radius:10px;border:0;background:var(--brand);color:var(--on);width:100%;margin-top:12px;cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.sm{width:auto;margin:0;padding:4px 10px;font-size:13px}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.goals label{margin:0;padding:10px 4px;text-align:center;border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer}
.goals input{display:none}.goals input:checked+span{font-weight:700;color:var(--brand)}
.goals label:has(input:checked){border-color:var(--brand);background:var(--bg)}
#reader{width:100%;border-radius:12px;overflow:hidden}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:99}
nav button{margin:0;border-radius:0;background:transparent;color:var(--mute);padding:14px 0}
nav button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
.tag{font-size:13px;color:var(--brand);margin-top:4px}.hide{display:none}.msg{color:var(--warn);font-size:14px;margin-top:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--bg);color:var(--mute);margin-bottom:6px}

.meal-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 16px}
.meal-tabs label{margin:0;padding:9px 0;text-align:center;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;background:var(--card);color:var(--mute)}
.meal-tabs input{display:none}
.meal-tabs label:has(input:checked){border-color:var(--brand);background:var(--brand);color:var(--on);font-weight:700}

.meal-block{border-top:1px solid var(--line);padding:12px 0 6px}
.meal-block:first-of-type{border-top:none;padding-top:0}
.meal-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.meal-title{font-size:16px;font-weight:700;color:var(--ink)}
.meal-summary{font-size:13px;color:var(--mute)}
.empty-meal{font-size:13px;color:var(--mute);padding:6px 0}
.auth-status{font-size:13px;padding:4px 8px;border-radius:6px;background:var(--bg);display:inline-block;margin-bottom:8px}
</style>
</head>
<body>
<main>
<section id="p-today">
  <h1>今日攝取</h1>
  <button id="newBtn" style="margin:0 0 14px">＋ 新增食物</button>
  <div class="card" id="sum"></div>
  <div class="card">
    <h2>今天吃了什麼</h2>
    <div id="logByMeal"></div>
  </div>
</section>

<section id="p-add" class="hide">
  <h1>新增食物</h1>
  <div class="card">
    <label style="margin-top:0">選擇記錄到哪一餐：</label>
    <div class="meal-tabs" id="activeMealTabs">
      <label><input type="radio" name="addMeal" value="breakfast"><span>早餐</span></label>
      <label><input type="radio" name="addMeal" value="lunch"><span>午餐</span></label>
      <label><input type="radio" name="addMeal" value="dinner"><span>晚餐</span></label>
      <label><input type="radio" name="addMeal" value="snack"><span>點心</span></label>
    </div>
    <button data-m="scan" style="margin-top:0">掃描條碼</button>
    <div class="mute">Open Food Facts ＋ Supabase 社群共享庫</div>
    <button data-m="cardAI">拍餐點，AI 估算</button>
    <div class="mute">透過 Gemini 視覺模型分析便當、小吃熱量</div>
    <button data-m="cardCF">選常見食物</button>
    <div class="mute">白飯、超商鮮食、連鎖餐飲等</div>
    <button data-m="cardM">自己輸入</button>
    <div class="mute">手動填寫熱量與三大營養素</div>
    <button class="ghost" data-gotoday>返回今日</button>
  </div>
</section>

<section id="p-scan" class="hide">
  <h1>掃描食品</h1>
  <button class="ghost" data-goadd style="margin:0 0 14px">← 返回選擇方式</button>
  <div class="card">
    <div id="reader"></div>
    <button id="startBtn">開啟相機掃條碼</button>
    <button class="ghost" id="shotBtn">拍照掃條碼（相機打不開時用）</button>
    <input id="shot" type="file" accept="image/*" capture="environment" class="hide">
    <label>或手動輸入條碼</label>
    <input id="manual" inputmode="numeric" placeholder="例如 4710088410009">
    <button class="ghost" id="lookBtn">查詢</button>
    <div class="msg" id="scanMsg"></div>
  </div>
  <div class="card hide" id="found">
    <div class="badge" id="fSrc">資料來源</div>
    <h2 id="fName" style="margin-top:4px"></h2>
    <div class="mute" id="fInfo"></div>
    <label>份數</label><input id="serv" type="number" step="0.5" min="0.5" value="1">
    <div class="tag" id="fTag"></div>
    <button id="addBtn">加入紀錄</button>
  </div>
  <div class="card hide" id="newForm">
    <h2>資料庫還沒有這個商品</h2>
    <div class="mute">可手動輸入，或拍攝包裝營養標示自動辨識。</div>
    <button class="ghost" id="photoBtn">拍營養標示，自動填寫</button>
    <input id="photo" type="file" accept="image/*" capture="environment" class="hide">
    <label>標示基準</label><select id="nB"><option>每份</option><option>每100g</option></select>
    <label>商品名稱</label><input id="nName">
    <div class="row">
      <div><label>熱量 (大卡)</label><input id="nK" type="number"></div>
      <div><label>蛋白質 (g)</label><input id="nP" type="number"></div>
    </div>
    <div class="row">
      <div><label>脂肪 (g)</label><input id="nF" type="number"></div>
      <div><label>碳水 (g)</label><input id="nC" type="number"></div>
    </div>
    <button id="saveNew">存進資料庫並加入紀錄</button>
  </div>
</section>

<section id="p-meal" class="hide">
  <h1>沒有條碼的餐點</h1>
  <button class="ghost" data-goadd style="margin:0 0 14px">← 返回選擇方式</button>
  <div class="card" id="cardAI">
    <h2>拍餐點，AI 估算</h2>
    <div class="mute">拍下整份餐點，由 Gemini 辨識食材與預估熱量。</div>
    <button id="mealBtn">拍餐點估熱量</button>
    <input id="mealPic" type="file" accept="image/*" capture="environment" class="hide">
    <div id="estList" style="margin-top:12px"></div>
    <button class="hide" id="estAdd">加入紀錄</button>
    <div class="msg" id="mealMsg"></div>
  </div>
  <div class="card" id="cardCF">
    <h2>選常見食物</h2>
    <label>選擇食物</label>
    <select id="cfName"></select>
    <div class="mute" id="cfUnit"></div>
    <label>份數</label><input id="cfN" type="number" step="0.5" min="0.5" value="1">
    <button id="cfAdd">加入紀錄</button>
  </div>
  <div class="card" id="cardM">
    <h2>自己輸入</h2>
    <label>名稱</label><input id="mName">
    <div class="row">
      <div><label>熱量 (大卡)</label><input id="mK" type="number"></div>
      <div><label>蛋白質 (g)</label><input id="mP" type="number"></div>
    </div>
    <div class="row">
      <div><label>脂肪 (g)</label><input id="mF" type="number"></div>
      <div><label>碳水 (g)</label><input id="mC" type="number"></div>
    </div>
    <button id="mAdd">加入紀錄</button>
  </div>
</section>

<section id="p-hist" class="hide">
  <h1>飲食紀錄</h1>
  <div class="card"><label>選擇日期</label><input id="hDate" type="date"><div id="hSum" style="margin-top:10px"></div></div>
  <div class="card"><h2>當日明細</h2><div id="hLog"></div></div>
  <div class="card"><h2>最近紀錄</h2><div id="hDays"></div></div>
</section>

<section id="p-me" class="hide">
  <h1>目標與雲端設定</h1>
  <div class="card">
    <div id="authBox">
      <h2>Supabase 雲端帳號</h2>
      <div id="authStatus" class="auth-status">連線中…</div>
      <div id="loginForm">
        <label>Email</label><input id="authEmail" type="email" placeholder="name@example.com">
        <label>密碼</label><input id="authPass" type="password" placeholder="密碼至少 6 碼">
        <div class="row">
          <button id="signInBtn">登入同步</button>
          <button class="ghost" id="signUpBtn">註冊新帳號</button>
        </div>
      </div>
      <div id="userPanel" class="hide">
        <button class="ghost" id="signOutBtn">登出帳號</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>個人目標</h2>
    <div class="goals">
      <label><input type="radio" name="goal" value="muscle"><span>增肌</span></label>
      <label><input type="radio" name="goal" value="fat" checked><span>減脂</span></label>
      <label><input type="radio" name="goal" value="lose"><span>減重</span></label>
    </div>
    <div class="row">
      <div><label>性別</label><select id="sex"><option value="m">男</option><option value="f">女</option></select></div>
      <div><label>年齡</label><input id="age" type="number" value="30"></div>
    </div>
    <div class="row">
      <div><label>身高 (cm)</label><input id="ht" type="number" value="170"></div>
      <div><label>體重 (kg)</label><input id="wt" type="number" value="65"></div>
    </div>
    <label>活動量</label>
    <select id="act">
      <option value="1.2">幾乎不運動</option>
      <option value="1.375">每週運動 1–3 天</option>
      <option value="1.55" selected>每週運動 3–5 天</option>
      <option value="1.725">每週運動 6–7 天</option>
    </select>
    <button id="saveMe">計算並儲存</button>
  </div>
  <div class="card" id="result"></div>
  
  <div class="card">
    class="card hide"
    <h2>API 設定</h2>
    <label>Supabase URL</label>
    <input id="sbUrl">
    <label>Supabase Publishable Key</label>
    <input id="sbKey" type="password">
    <label>Google Gemini API Key</label>
    <input id="geminiKey" type="password" placeholder="登入後自動載入，或手動輸入">
    <button class="ghost" id="saveKeysBtn">儲存所有金鑰</button>
    <button class="ghost" id="resetCacheBtn" style="color:var(--warn);border-color:var(--warn);margin-top:16px">清除本地快取並重新整理</button>
  </div>
</section>
</main>

<nav>
  <button data-p="today" class="on">今日</button>
  <button data-p="hist">紀錄</button>
  <button data-p="me">設定</button>
</nav>

<script>
// 全域錯誤捕獲，防止白畫面無提示
window.onerror = function(msg, url, line) {
  console.error("Critical Error:", msg, "at line:", line);
};

const $ = id => document.getElementById(id);

const DEFAULT_SB_URL = "https://ytmjeadpzuzrfxawcyfi.supabase.co";
const DEFAULT_SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0bWplYWRwenV6cmZ4YXdjeWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MjgzOTEsImV4cCI6MjEwNjMwNDM5MX0.4AYjLPcUQEPIV4RXfqKoYIAAuyhuqe1U-ACDBj3LOMM";
const DEFAULT_ME = { goal: "fat", sex: "m", age: 30, ht: 170, wt: 65, act: 1.55 };

let S = {
  me: DEFAULT_ME,
  log: {},
  sbUrl: DEFAULT_SB_URL,
  sbKey: DEFAULT_SB_KEY,
  geminiKey: ""
};

// 安全載入快取
try {
  const r = localStorage.getItem("nutri_v3");
  if (r) {
    const cached = JSON.parse(r);
    if (cached && typeof cached === "object") {
      S = Object.assign(S, cached);
    }
  }
} catch(e) {
  console.warn("快取解析失敗");
}

if (!S.me || typeof S.me !== "object") S.me = DEFAULT_ME;
if (!S.sbUrl) S.sbUrl = DEFAULT_SB_URL;
if (!S.sbKey) S.sbKey = DEFAULT_SB_KEY;

const save = () => { try { localStorage.setItem("nutri_v3", JSON.stringify(S)); } catch(e){} };
const esc = t => String(t || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => new Date().toLocaleDateString("sv");
const GN = { muscle: "增肌", fat: "減脂", lose: "減重" };
const MEALS = [
  { key: "breakfast", name: "早餐", icon: "🌅" },
  { key: "lunch", name: "午餐", icon: "☀️" },
  { key: "dinner", name: "晚餐", icon: "🌙" },
  { key: "snack", name: "點心／補給", icon: "🍎" }
];

let sbClient = null;
let currentUser = null;

/* 優先綁定核心導航與點擊事件 */
const VIEWS = ["today", "add", "scan", "meal", "hist", "me"];
function showView(v, mode) {
  VIEWS.forEach(p => {
    const el = $("p-" + p);
    if (el) el.classList.toggle("hide", p !== v);
  });
  const nv = ({ add: "today", scan: "today", meal: "today" })[v] || v;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x.dataset.p === nv));
  
  if (v !== "scan") stopScan();
  if (v === "scan") {
    $("found").classList.add("hide");
    $("newForm").classList.add("hide");
    $("scanMsg").textContent = "";
    $("manual").value = "";
  }
  if (v === "meal") {
    ["cardAI", "cardCF", "cardM"].forEach(id => {
      const el = $(id);
      if (el) el.classList.toggle("hide", id !== mode);
    });
    $("mealMsg").textContent = "";
  }
  if (v === "today") renderToday();
  if (v === "hist") {
    if (!$("hDate").value) $("hDate").value = today();
    renderHist();
  }
  window.scrollTo(0, 0);
}

document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => showView(b.dataset.p);
});

$("newBtn").onclick = () => {
  setSelectedMeal(getCurrentMealKey());
  showView("add");
};

document.querySelectorAll("[data-m]").forEach(b => {
  b.onclick = () => {
    const m = b.dataset.m;
    m === "scan" ? showView("scan") : showView("meal", m);
  };
});

document.querySelectorAll("[data-goadd]").forEach(b => b.onclick = () => showView("add"));
document.querySelectorAll("[data-gotoday]").forEach(b => b.onclick = () => showView("today"));

function getCurrentMealKey() {
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  if (h >= 5 && h < 10.5) return "breakfast";
  if (h >= 10.5 && h < 14.5) return "lunch";
  if (h >= 16.5 && h < 21) return "dinner";
  return "snack";
}

function getSelectedMeal() {
  const checked = document.querySelector('input[name="addMeal"]:checked');
  return checked ? checked.value : getCurrentMealKey();
}

function setSelectedMeal(key) {
  const el = document.querySelector(`input[name="addMeal"][value="${key}"]`);
  if (el) el.checked = true;
}

function calc(m) {
  if (!m) m = DEFAULT_ME;
  const bmr = 10 * (m.wt || 65) + 6.25 * (m.ht || 170) - 5 * (m.age || 30) + (m.sex === "m" ? 5 : -161);
  const tdee = bmr * (m.act || 1.55);
  const adj = { muscle: 1.12, fat: 0.85, lose: 0.8 }[m.goal] || 0.85;
  const floor = m.sex === "m" ? 1500 : 1200;
  let kcal = Math.max(Math.round(tdee * adj), floor);
  const pk = { muscle: 2.0, fat: 2.0, lose: 1.6 }[m.goal] || 2.0;
  const p = Math.round((m.wt || 65) * pk);
  const f = Math.round(kcal * 0.25 / 9);
  const c = Math.max(Math.round((kcal - p * 4 - f * 9) / 4), 0);
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, p, f, c, floored: Math.round(tdee * adj) < floor };
}

function sumList(L) {
  return (L || []).reduce((a, e) => {
    const n = Number(e.n) || 1;
    a.k += (Number(e.k) || 0) * n;
    a.p += (Number(e.p) || 0) * n;
    a.f += (Number(e.f) || 0) * n;
    a.c += (Number(e.c) || 0) * n;
    return a;
  }, { k: 0, p: 0, f: 0, c: 0 });
}

function bar(name, v, goal, col, u) {
  const pct = goal ? Math.min(v / goal * 100, 100) : 0;
  return `<div class="bar"><div class="t"><span>${name}</span><span>${Math.round(v)} / ${goal || "?"} ${u}</span></div><div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div></div></div>`;
}

function renderMealSection(dateKey, isEditable = true) {
  const dayLogs = S.log[dateKey] || [];
  return MEALS.map(meal => {
    const itemsWithIndex = dayLogs
      .map((item, idx) => ({ ...item, originalIdx: idx }))
      .filter(item => (item.meal || "snack") === meal.key);

    const mealSum = sumList(itemsWithIndex);

    let itemsHtml = itemsWithIndex.map(e => `
      <div class="item">
        <div>
          ${e.t ? `<span class="mute">${e.t}</span> ` : ""}${esc(e.name)}
          <div class="mute">${e.n} 份・${Math.round(e.k * e.n)} 大卡・P ${Math.round(e.p * e.n)}g / F ${Math.round(e.f * e.n)}g / C ${Math.round(e.c * e.n)}g</div>
        </div>
        ${isEditable ? `<button class="sm ghost" data-del="${e.originalIdx}">刪除</button>` : ''}
      </div>
    `).join("");

    if (!itemsWithIndex.length) {
      itemsHtml = `<div class="empty-meal">尚未記錄</div>`;
    }

    return `
      <div class="meal-block">
        <div class="meal-header">
          <span class="meal-title">${meal.icon} ${meal.name}</span>
          <span class="meal-summary">${Math.round(mealSum.k)} 大卡</span>
        </div>
        ${itemsHtml}
      </div>
    `;
  }).join("");
}

function renderToday() {
  const T = sumList(S.log[today()] || []);
  const g = calc(S.me);
  const left = g.kcal - Math.round(T.k);

  $("sum").innerHTML = `
    <div class="big">${left >= 0 ? left : -left} <span class="mute">大卡${left >= 0 ? "還可以吃" : "已超過"}</span></div>
    ${bar("熱量", T.k, g.kcal, "var(--kcal)", "大卡")}

const fileToBase64 = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(",")[1]);
  r.onerror = rej;
  r.readAsDataURL(f);
});

async function callGeminiVision(prompt, file) {
  if (!S.geminiKey) throw new Error("尚未載入 Gemini API Key，請先登入帳號或於設定手動輸入。");
  const base64Data = await fileToBase64(file);
  const mimeType = file.type || "image/jpeg";
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${S.geminiKey}`;

  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{
        parts: [
          { text: prompt },
          { inline_data: { mime_type: mimeType, data: base64Data } }
        ]
      }],
      generationConfig: { response_mime_type: "application/json", temperature: 0.2 }
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API 請求失敗 (${res.status})`);
  }
  const data = await res.json();
  const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!rawText) throw new Error("無法取得分析結果");
  return JSON.parse(rawText);
}

async function fetchOpenFoodFacts(barcode) {
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
    if (!res.ok) return null;
    const data = await res.json();
    if (data.status !== 1 || !data.product) return null;
    const p = data.product, nut = p.nutriments || {};
    const isServing = nut["energy-kcal_serving"] !== undefined;
    return {
      name: p.product_name_zh || p.product_name || `商品 (${barcode})`,
      basis: isServing ? "每份" : "每100g",
      k: Math.round(Number(isServing ? nut["energy-kcal_serving"] : nut["energy-kcal_100g"])) || 0,
      p: Math.round(Number(isServing ? nut["proteins_serving"] : nut["proteins_100g"]) * 10) / 10 || 0,
      f: Math.round(Number(isServing ? nut["fat_serving"] : nut["fat_100g"]) * 10) / 10 || 0,
      c: Math.round(Number(isServing ? nut["carbohydrates_serving"] : nut["carbohydrates_100g"]) * 10) / 10 || 0,
      source: "Open Food Facts"
    };
  } catch(e) { return null; }
}

async function lookup(code) {
  curBarcode = code;
  $("scanMsg").textContent = "查詢中：" + code;
  let it = null, source = "";

  if (sbClient) {
    try {
      const { data } = await sbClient.from('custom_foods').select('*').eq('barcode', code).maybeSingle();
      if (data) {
        it = { name: data.name, basis: data.basis, k: Number(data.kcal), p: Number(data.protein), f: Number(data.fat), c: Number(data.carbs) };
        source = "Supabase 社群資料庫";
      }
    } catch(e){}
  }

  if (!it) {
    it = await fetchOpenFoodFacts(code);
    if (it) source = "Open Food Facts 公共資料庫";
  }

  curItem = it;
  $("found").classList.toggle("hide", !it);
  $("newForm").classList.toggle("hide", !!it);

  if (!it) {
    $("scanMsg").textContent = "資料庫無此商品，請拍照或手動填寫。";
    $("nName").value = ""; $("nK").value = ""; $("nP").value = ""; $("nF").value = ""; $("nC").value = "";
    return;
  }

  $("scanMsg").textContent = "";
  $("fSrc").textContent = source;
  $("fName").textContent = it.name;
  $("fInfo").textContent = `${it.basis || "每份"} ${it.k} 大卡・蛋白質 ${it.p} g・脂肪 ${it.f} g・碳水 ${it.c} g`;
  $("fTag").textContent = `條碼：${code}`;
}

async function addLog(it, n) {
  const mealKey = getSelectedMeal();
  const timeStr = new Date().toTimeString().slice(0, 5);
  const logItem = {
    name: it.name,
    k: it.k,
    p: it.p,
    f: it.f,
    c: it.c,
    n: n,
    meal: mealKey,
    t: timeStr
  };

  (S.log[today()] = S.log[today()] || []).push(logItem);
  save();
  renderToday();

  if (sbClient && currentUser) {
    try {
      const { data, error } = await sbClient.from('diet_logs').insert([{
        user_id: currentUser.id,
        date: today(),
        meal: mealKey,
        name: it.name,
        servings: n,
        kcal: it.k,
        protein: it.p,
        fat: it.f,
        carbs: it.c,
        logged_at: timeStr
      }]).select();

      if (!error && data && data[0]) {
        logItem.id = data[0].id;
        save();
      }
    } catch(e) {}
  }
}

  if (!n || isNaN(k)) return alert("請填寫品項名稱與熱量");

    k: k,
    p: +$("mP").value || 0,
    f: +$("mF").value || 0,
    c: +$("mC").value || 0
  }, 1);
