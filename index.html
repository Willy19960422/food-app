<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食養紀錄 · 雲端同步版</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#EDF3F0;--card:#fff;--ink:#12302B;--mute:#5F7A73;--line:#D3E0DB;--brand:#0F5C4F;--on:#fff;--kcal:#E8961E;--pro:#2F6FD0;--fat:#C0508A;--carb:#3E9B5B;--warn:#B3402A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A17;--card:#172924;--ink:#E4F1EC;--mute:#8FAAA2;--line:#284039;--brand:#4FC3AB;--on:#06201B}}
:root[data-theme="dark"]{--bg:#0E1A17;--card:#172924;--ink:#E4F1EC;--mute:#8FAAA2;--line:#284039;--brand:#4FC3AB;--on:#06201B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;padding-bottom:76px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.big{font-size:34px;font-weight:700;line-height:1.1}.mute{color:var(--mute);font-size:14px}
.bar{margin:10px 0}.bar .t{display:flex;justify-content:space-between;font-size:14px}
.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:6px;transition:width .4s}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:500;padding:12px 16px;border-radius:10px;border:0;background:var(--brand);color:var(--on);width:100%;margin-top:12px;cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.sm{width:auto;margin:0;padding:4px 10px;font-size:13px}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.goals label{margin:0;padding:10px 4px;text-align:center;border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer}
.goals input{display:none}.goals input:checked+span{font-weight:700;color:var(--brand)}
.goals label:has(input:checked){border-color:var(--brand);background:var(--bg)}
#reader{width:100%;border-radius:12px;overflow:hidden}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:99}
nav button{margin:0;border-radius:0;background:transparent;color:var(--mute);padding:14px 0}
nav button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
.tag{font-size:13px;color:var(--brand);margin-top:4px}.hide{display:none !important}.msg{color:var(--warn);font-size:14px;margin-top:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--bg);color:var(--mute);margin-bottom:6px}

.meal-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 16px}
.meal-tabs label{margin:0;padding:9px 0;text-align:center;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;background:var(--card);color:var(--mute)}
.meal-tabs input{display:none}
.meal-tabs label:has(input:checked){border-color:var(--brand);background:var(--brand);color:var(--on);font-weight:700}

.segmented{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 14px}
.segmented button{margin-top:0;padding:9px 0;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.segmented button.active{background:var(--brand);color:var(--on);font-weight:700;border-color:var(--brand)}

.meal-block{border-top:1px solid var(--line);padding:12px 0 6px}
.meal-block:first-of-type{border-top:none;padding-top:0}
.meal-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.meal-title{font-size:16px;font-weight:700;color:var(--ink)}
.meal-summary{font-size:13px;color:var(--mute)}
.empty-meal{font-size:13px;color:var(--mute);padding:6px 0}

.auth-hero{text-align:center;padding:24px 0 12px}
.auth-hero h1{font-size:26px;color:var(--brand);margin-bottom:4px}
.auth-hero p{color:var(--mute);margin:0;font-size:15px}
.auth-msg{font-size:13px;color:var(--warn);margin-top:8px;min-height:20px;text-align:center}
.check-inline{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--ink);cursor:pointer}
.check-inline input{width:auto;margin:0}
</style>
</head>
<body>
<main>
<!-- 1. 登入/註冊頁面 -->
<section id="p-auth">
  <div class="auth-hero">
    <h1>食養紀錄</h1>
    <p>智慧掃描 · 雲端同步 · 飲食目標管理</p>
  </div>
  <div class="card">
    <h2 id="authTitle">登入您的帳號</h2>
    <label>Email 信箱</label>
    <input id="authEmail" type="email" placeholder="name@example.com" autocomplete="email">
    <label>密碼</label>
    <input id="authPass" type="password" placeholder="密碼至少 6 碼" autocomplete="current-password">
    <button id="authPrimaryBtn">立即登入</button>
    <button class="ghost" id="authToggleBtn">還沒有帳號？點此註冊</button>
    <div id="authErrMsg" class="auth-msg"></div>
  </div>
</section>

<!-- 2. 初次設定目標頁面 (Onboarding 引導頁) -->
<section id="p-onboarding" class="hide">
  <div class="auth-hero">
    <h1>設定個人目標</h1>
    <p>計算您的基礎代謝率與每日消耗量</p>
  </div>
  <div class="card">
    <div class="goals">
      <label><input type="radio" name="ob-goal" value="muscle"><span>增肌</span></label>
      <label><input type="radio" name="ob-goal" value="fat" checked><span>減脂</span></label>
      <label><input type="radio" name="ob-goal" value="lose"><span>減重</span></label>
    </div>
    <div class="row">
      <div><label>性別</label><select id="ob-sex"><option value="m">男</option><option value="f">女</option></select></div>
      <div><label>年齡</label><input id="ob-age" type="number" value="30"></div>
    </div>
    <div class="row">
      <div><label>身高 (cm)</label><input id="ob-ht" type="number" value="170"></div>
      <div><label>體重 (kg)</label><input id="ob-wt" type="number" value="65"></div>
    </div>
    <label>活動量</label>
    <select id="ob-act">
      <option value="1.2">幾乎不運動</option>
      <option value="1.375">每週運動 1–3 天</option>
      <option value="1.55" selected>每週運動 3–5 天</option>
      <option value="1.725">每週運動 6–7 天</option>
    </select>
    <button id="obSaveBtn">完成設定，開始使用</button>
  </div>
</section>

<!-- 3. 今日主頁 -->
<section id="p-today" class="hide">
  <h1>今日攝取</h1>
  <button id="newBtn" style="margin:0 0 14px">新增食物</button>
  <div class="card" id="sum"></div>
  <div class="card">
    <h2>今天吃了什麼</h2>
    <div id="logByMeal"></div>
  </div>
</section>

<!-- 4. 新增入口：精簡為二合一管道 -->
<section id="p-add" class="hide">
  <h1>新增食物</h1>
  <div class="card">
    <label style="margin-top:0">選擇記錄到哪一餐：</label>
    <div class="meal-tabs" id="activeMealTabs">
      <label><input type="radio" name="addMeal" value="breakfast"><span>早餐</span></label>
      <label><input type="radio" name="addMeal" value="lunch"><span>午餐</span></label>
      <label><input type="radio" name="addMeal" value="dinner"><span>晚餐</span></label>
      <label><input type="radio" name="addMeal" value="snack"><span>點心</span></label>
    </div>
    <button id="navToCamBtn" style="margin-top:0">相機辨識</button>
    <div class="mute">掃描食品條碼 或 拍攝整盤餐點 AI 估算</div>
    <button id="navToListBtn">食物清單與自訂</button>
    <div class="mute">選取常見外食／自訂常用食物 或 手動輸入</div>
    <button class="ghost" data-gotoday>返回今日</button>
  </div>
</section>

<!-- 5. 整合相機中心 (條碼 + 餐點估算) -->
<section id="p-cam" class="hide">
  <h1>相機辨識</h1>
  <button class="ghost" data-goadd style="margin:0 0 14px">返回選擇方式</button>
  <div class="segmented">
    <button id="camModeBarcode" class="active">掃描條碼</button>
    <button id="camModeMeal">拍餐點估算</button>
  </div>

  <!-- 條碼掃描區塊 -->
  <div id="camBarcodeBox">
    <div class="card">
      <div id="reader"></div>
      <button id="startBtn">開啟相機掃條碼</button>
      <button class="ghost" id="shotBtn">拍照掃條碼（相機打不開時用）</button>
      <input id="shot" type="file" accept="image/*" capture="environment" class="hide">
      <label>或手動輸入條碼</label>
      <input id="manual" inputmode="numeric" placeholder="例如 4710088410009">
      <button class="ghost" id="lookBtn">查詢條碼</button>
      <div class="msg" id="scanMsg"></div>
    </div>
    <div class="card hide" id="found">
      <div class="badge" id="fSrc">資料來源</div>
      <h2 id="fName" style="margin-top:4px"></h2>
      <div class="mute" id="fInfo"></div>
      <label>份數</label><input id="serv" type="number" step="0.5" min="0.5" value="1">
      <div class="tag" id="fTag"></div>
      <button id="addBtn">加入紀錄</button>
    </div>
    <div class="card hide" id="newForm">
      <h2>資料庫尚無此商品</h2>
      <div class="mute">可手動輸入，或拍攝包裝營養標示自動填入。</div>
      <button class="ghost" id="photoBtn">拍營養標示，自動填寫</button>
      <input id="photo" type="file" accept="image/*" capture="environment" class="hide">
      <label>標示基準</label><select id="nB"><option>每份</option><option>每100g</option></select>
      <label>商品名稱</label><input id="nName">
      <div class="row">
        <div><label>熱量 (大卡)</label><input id="nK" type="number"></div>
        <div><label>蛋白質 (g)</label><input id="nP" type="number"></div>
      </div>
      <div class="row">
        <div><label>脂肪 (g)</label><input id="nF" type="number"></div>
        <div><label>碳水 (g)</label><input id="nC" type="number"></div>
      </div>
      <button id="saveNew">存進資料庫並加入紀錄</button>
    </div>
  </div>

  <!-- 拍餐點估算區塊 -->
  <div id="camMealBox" class="hide">
    <div class="card">
      <h2>拍餐點，AI 估算</h2>
      <div class="mute">拍攝餐點，由 Gemini 分析食材並預估熱量。</div>
      <button id="mealBtn">拍攝或上傳餐點照片</button>
      <input id="mealPic" type="file" accept="image/*" capture="environment" class="hide">
      <div id="estList" style="margin-top:12px"></div>
      <button class="hide" id="estAdd">加入選取項目至紀錄</button>
      <div class="msg" id="mealMsg"></div>
    </div>
  </div>
</section>

<!-- 6. 整合食物清單與手動輸入 -->
<section id="p-list" class="hide">
  <h1>食物清單與自訂</h1>
  <button class="ghost" data-goadd style="margin:0 0 14px">返回選擇方式</button>
  <div class="segmented">
    <button id="listModeSelect" class="active">挑選食物</button>
    <button id="listModeManual">手動輸入</button>
  </div>

  <!-- 下拉挑選 (內建常用 + 我的自訂常用) -->
  <div id="boxSelectFood" class="card">
    <h2>挑選食物</h2>
    <label>選擇品項</label>
    <select id="cfName"></select>
    <div class="mute" id="cfUnit"></div>
    <label>份數</label><input id="cfN" type="number" step="0.5" min="0.5" value="1">
    <button id="cfAdd">加入紀錄</button>
  </div>

  <!-- 手動自訂輸入 -->
  <div id="boxManualFood" class="card hide">
    <h2>自己輸入</h2>
    <label>品項名稱</label><input id="mName" placeholder="例如：自煮雞肉溫沙拉">
    <div class="row">
      <div><label>熱量 (大卡)</label><input id="mK" type="number"></div>
      <div><label>蛋白質 (g)</label><input id="mP" type="number"></div>
    </div>
    <div class="row">
      <div><label>脂肪 (g)</label><input id="mF" type="number"></div>
      <div><label>碳水 (g)</label><input id="mC" type="number"></div>
    </div>
    <label class="check-inline">
      <input type="checkbox" id="mSaveFavorite" checked>
      <span>同步存入我的常用食物清單</span>
    </label>
    <button id="mAdd">加入紀錄</button>
  </div>
</section>

<!-- 7. 歷史紀錄 -->
<section id="p-hist" class="hide">
  <h1>飲食紀錄</h1>
  <div class="card"><label>選擇日期</label><input id="hDate" type="date"><div id="hSum" style="margin-top:10px"></div></div>
  <div class="card"><h2>當日明細</h2><div id="hLog"></div></div>
  <div class="card"><h2>最近紀錄</h2><div id="hDays"></div></div>
</section>

<!-- 8. 個人設定頁 -->
<section id="p-me" class="hide">
  <h1>我的設定與目標</h1>
  <div class="card">
    <h2>雲端帳號</h2>
    <div id="userEmailTag" style="font-weight:700;margin-bottom:8px"></div>
    <button class="ghost" id="signOutBtn" style="color:var(--warn);border-color:var(--warn)">登出帳號</button>
  </div>

  <div class="card">
    <h2>修改個人目標</h2>
    <div class="goals">
      <label><input type="radio" name="goal" value="muscle"><span>增肌</span></label>
      <label><input type="radio" name="goal" value="fat" checked><span>減脂</span></label>
      <label><input type="radio" name="goal" value="lose"><span>減重</span></label>
    </div>
    <div class="row">
      <div><label>性別</label><select id="sex"><option value="m">男</option><option value="f">女</option></select></div>
      <div><label>年齡</label><input id="age" type="number" value="30"></div>
    </div>
    <div class="row">
      <div><label>身高 (cm)</label><input id="ht" type="number" value="170"></div>
      <div><label>體重 (kg)</label><input id="wt" type="number" value="65"></div>
    </div>
    <label>活動量</label>
    <select id="act">
      <option value="1.2">幾乎不運動</option>
      <option value="1.375">每週運動 1–3 天</option>
      <option value="1.55" selected>每週運動 3–5 天</option>
      <option value="1.725">每週運動 6–7 天</option>
    </select>
    <button id="saveMe">更新目標</button>
  </div>
  <div class="card" id="result"></div>
</section>
</main>

<nav id="bottomNav" class="hide">
  <button data-p="today" class="on">今日</button>
  <button data-p="hist">紀錄</button>
  <button data-p="me">設定</button>
</nav>

<script>
const $ = id => document.getElementById(id);

const SB_URL = "https://ytmjeadpzuzrfxawcyfi.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0bWplYWRwenV6cmZ4YXdjeWZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MjgzOTEsImV4cCI6MjEwNjMwNDM5MX0.4AYjLPcUQEPIV4RXfqKoYIAAuyhuqe1U-ACDBj3LOMM";

let S = {
  me: null,
  log: {},
  customFavorites: [], // 自訂常用食物
  geminiKey: ""
};

try {
  const r = localStorage.getItem("nutri_v3");
  if (r) {
    const cached = JSON.parse(r);
    if (cached && typeof cached === "object") S = Object.assign(S, cached);
  }
} catch(e) {}

if (!S.customFavorites) S.customFavorites = [];

const save = () => { try { localStorage.setItem("nutri_v3", JSON.stringify(S)); } catch(e){} };
const esc = t => String(t || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => new Date().toLocaleDateString("sv");
const GN = { muscle: "增肌", fat: "減脂", lose: "減重" };
const MEALS = [
  { key: "breakfast", name: "早餐" },
  { key: "lunch", name: "午餐" },
  { key: "dinner", name: "晚餐" },
  { key: "snack", name: "點心" }
];

let sbClient = null;
let currentUser = null;
let isSignUpMode = false;

/* 初始化 Supabase */
function initSupabase() {
  try {
    if (window.supabase && typeof window.supabase.createClient === "function") {
      sbClient = window.supabase.createClient(SB_URL, SB_KEY);
      sbClient.auth.onAuthStateChange((event, session) => {
        currentUser = session ? session.user : null;
        handleAuthFlow();
      });
      checkUser();
    }
  } catch(err) {
    console.error("Supabase 連線失敗:", err);
  }
}

async function checkUser() {
  if (!sbClient) return;
  try {
    const { data: { session } } = await sbClient.auth.getSession();
    currentUser = session ? session.user : null;
    handleAuthFlow();
  } catch(e) {
    handleAuthFlow();
  }
}

/* 核心流程切換 */
async function handleAuthFlow() {
  if (!currentUser) {
    showOnlySection("p-auth");
    $("bottomNav").classList.add("hide");
    return;
  }

  $("userEmailTag").textContent = `目前登入帳號：${currentUser.email}`;
  loadServerConfig();
  syncLogsFromSupabase();
  loadCustomFavorites();

  if (!S.me) {
    try {
      const { data } = await sbClient.from('user_profiles').select('*').eq('user_id', currentUser.id).maybeSingle();
      if (data) {
        S.me = {
          goal: data.goal,
          sex: data.sex,
          age: data.age,
          ht: Number(data.height),
          wt: Number(data.weight),
          act: Number(data.activity)
        };
        save();
      }
    } catch(e) {}
  }

  if (!S.me) {
    showOnlySection("p-onboarding");
    $("bottomNav").classList.add("hide");
  } else {
    $("bottomNav").classList.remove("hide");
    loadMe();
    renderFoodDropdown();
    showView("today");
  }
}

function showOnlySection(secId) {
  const allSecs = ["p-auth", "p-onboarding", "p-today", "p-add", "p-cam", "p-list", "p-hist", "p-me"];
  allSecs.forEach(id => {
    const el = $(id);
    if (el) el.classList.toggle("hide", id !== secId);
  });
  window.scrollTo(0, 0);
}

/* 登入／註冊 */
$("authToggleBtn").onclick = () => {
  isSignUpMode = !isSignUpMode;
  $("authTitle").textContent = isSignUpMode ? "註冊新帳號" : "登入您的帳號";
  $("authPrimaryBtn").textContent = isSignUpMode ? "立即註冊" : "立即登入";
  $("authToggleBtn").textContent = isSignUpMode ? "已有帳號？點此登入" : "還沒有帳號？點此註冊";
  $("authErrMsg").textContent = "";
};

$("authPrimaryBtn").onclick = async () => {
  if (!sbClient) return alert("連線尚未準備好，請稍候重試");
  const email = $("authEmail").value.trim(), password = $("authPass").value.trim();
  if (!email || !password) {
    $("authErrMsg").textContent = "請輸入 Email 與密碼";
    return;
  }
  $("authErrMsg").textContent = "連線驗證中…";

  if (isSignUpMode) {
    const { data, error } = await sbClient.auth.signUp({ email, password });
    if (error) $("authErrMsg").textContent = "註冊失敗：" + error.message;
    else {
      currentUser = data.user;
      handleAuthFlow();
    }
  } else {
    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });

function getCurrentMealKey() {
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  if (h >= 5 && h < 10.5) return "breakfast";
  if (h >= 10.5 && h < 14.5) return "lunch";
  if (h >= 16.5 && h < 21) return "dinner";
  return "snack";
}

function getSelectedMeal() {
  const checked = document.querySelector('input[name="addMeal"]:checked');
  return checked ? checked.value : getCurrentMealKey();
}

function setSelectedMeal(key) {
  const el = document.querySelector(`input[name="addMeal"][value="${key}"]`);
  if (el) el.checked = true;
}

function calc(m) {
  if (!m) m = { goal: "fat", sex: "m", age: 30, ht: 170, wt: 65, act: 1.55 };
  const bmr = 10 * (m.wt || 65) + 6.25 * (m.ht || 170) - 5 * (m.age || 30) + (m.sex === "m" ? 5 : -161);
  const tdee = bmr * (m.act || 1.55);
  const adj = { muscle: 1.12, fat: 0.85, lose: 0.8 }[m.goal] || 0.85;
  const floor = m.sex === "m" ? 1500 : 1200;
  let kcal = Math.max(Math.round(tdee * adj), floor);
  const pk = { muscle: 2.0, fat: 2.0, lose: 1.6 }[m.goal] || 2.0;
  const p = Math.round((m.wt || 65) * pk);
  const f = Math.round(kcal * 0.25 / 9);
  const c = Math.max(Math.round((kcal - p * 4 - f * 9) / 4), 0);
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, p, f, c, floored: Math.round(tdee * adj) < floor };
}

function sumList(L) {
  return (L || []).reduce((a, e) => {
    const n = Number(e.n) || 1;
    a.k += (Number(e.k) || 0) * n;
    a.p += (Number(e.p) || 0) * n;
    a.f += (Number(e.f) || 0) * n;
    a.c += (Number(e.c) || 0) * n;
    return a;
  }, { k: 0, p: 0, f: 0, c: 0 });
}

function bar(name, v, goal, col, u) {
  const pct = goal ? Math.min(v / goal * 100, 100) : 0;
  return `<div class="bar"><div class="t"><span>${name}</span><span>${Math.round(v)} / ${goal || "?"} ${u}</span></div><div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div></div></div>`;
}

function renderMealSection(dateKey, isEditable = true) {
  const dayLogs = S.log[dateKey] || [];
  return MEALS.map(meal => {
    const itemsWithIndex = dayLogs
      .map((item, idx) => ({ ...item, originalIdx: idx }))
      .filter(item => (item.meal || "snack") === meal.key);

    const mealSum = sumList(itemsWithIndex);

    let itemsHtml = itemsWithIndex.map(e => `
      <div class="item">
        <div>
          ${e.t ? `<span class="mute">${e.t}</span> ` : ""}${esc(e.name)}
          <div class="mute">${e.n} 份・${Math.round(e.k * e.n)} 大卡・P ${Math.round(e.p * e.n)}g / F ${Math.round(e.f * e.n)}g / C ${Math.round(e.c * e.n)}g</div>
        </div>
        ${isEditable ? `<button class="sm ghost" data-del="${e.originalIdx}">刪除</button>` : ''}
      </div>
    `).join("");

    if (!itemsWithIndex.length) {
      itemsHtml = `<div class="empty-meal">尚未記錄</div>`;
    }

    return `
      <div class="meal-block">
        <div class="meal-header">
          <span class="meal-title">${meal.name}</span>
          <span class="meal-summary">${Math.round(mealSum.k)} 大卡</span>
        </div>
        ${itemsHtml}
      </div>
    `;
  }).join("");
}

/* 檔案轉 Base64 */
const fileToBase64 = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(",")[1]);
  r.onerror = rej;
  r.readAsDataURL(f);
});

async function callGeminiVision(prompt, file) {
  if (!S.geminiKey) throw new Error("尚未載入 Gemini API Key，請確認後端已配置。");
  const base64Data = await fileToBase64(file);
  const mimeType = file.type || "image/jpeg";
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${S.geminiKey}`;

  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{
        parts: [
          { text: prompt },
          { inline_data: { mime_type: mimeType, data: base64Data } }
        ]
      }],
      generationConfig: { response_mime_type: "application/json", temperature: 0.2 }
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API 請求失敗 (${res.status})`);
  }
  const data = await res.json();
  const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!rawText) throw new Error("無法取得分析結果");
  return JSON.parse(rawText);
}

async function fetchOpenFoodFacts(barcode) {
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
    if (!res.ok) return null;
    const data = await res.json();
    if (data.status !== 1 || !data.product) return null;
    const p = data.product, nut = p.nutriments || {};
    const isServing = nut["energy-kcal_serving"] !== undefined;
    return {
      name: p.product_name_zh || p.product_name || `商品 (${barcode})`,
      basis: isServing ? "每份" : "每100g",
      k: Math.round(Number(isServing ? nut["energy-kcal_serving"] : nut["energy-kcal_100g"])) || 0,
      p: Math.round(Number(isServing ? nut["proteins_serving"] : nut["proteins_100g"]) * 10) / 10 || 0,
      f: Math.round(Number(isServing ? nut["fat_serving"] : nut["fat_100g"]) * 10) / 10 || 0,
      c: Math.round(Number(isServing ? nut["carbohydrates_serving"] : nut["carbohydrates_100g"]) * 10) / 10 || 0,
      source: "Open Food Facts"
    };
  } catch(e) { return null; }
}

async function lookup(code) {
  curBarcode = code;
  $("scanMsg").textContent = "查詢中：" + code;
  let it = null, source = "";

  if (sbClient) {
    try {
      const { data } = await sbClient.from('custom_foods').select('*').eq('barcode', code).maybeSingle();
      if (data) {
        it = { name: data.name, basis: data.basis, k: Number(data.kcal), p: Number(data.protein), f: Number(data.fat), c: Number(data.carbs) };
        source = "Supabase 資料庫";
      }
    } catch(e){}
  }

  if (!it) {
    it = await fetchOpenFoodFacts(code);
    if (it) source = "Open Food Facts 公共庫";
  }

  curItem = it;
  $("found").classList.toggle("hide", !it);
  $("newForm").classList.toggle("hide", !!it);

  if (!it) {
    $("scanMsg").textContent = "資料庫無此商品，請拍照或手動填寫。";
    $("nName").value = ""; $("nK").value = ""; $("nP").value = ""; $("nF").value = ""; $("nC").value = "";
    return;
  }

  $("scanMsg").textContent = "";
  $("fSrc").textContent = source;
  $("fName").textContent = it.name;
  $("fInfo").textContent = `${it.basis || "每份"} ${it.k} 大卡・蛋白質 ${it.p} g・脂肪 ${it.f} g・碳水 ${it.c} g`;

}

    const r = await callGeminiVision(`請拆解餐點中的每樣食物與主副食，以台灣份量估算熱量。只回傳 JSON：{"items":[{"name":"食物名稱","portion":"份量說明","k":熱量大卡,"p":蛋白質克數,"f":脂肪克數,"c":碳水克數}]}`, f);
    EST = (r.items || []).map(x => ({
      name: String(x.name || "食物"),
      portion: x.portion || "",
      k: +x.k || 0,
      p: +x.p || 0,
      f: +x.f || 0,
      c: +x.c || 0,
      on: true
    }));
    showEst();
    $("mealMsg").textContent = EST.length ? "辨識完成，可調整熱量後加入。" : "未能辨識出餐點。";
  } catch(err) {
    $("mealMsg").textContent = "分析失敗：" + err.message;
  }
  e.target.value = "";
};

$("estAdd").onclick = () => {
  const on = EST.filter(x => x.on && x.k > 0);
  if (!on.length) return alert("沒有選取任何項目。");
  on.forEach(x => addLog({ name: x.name, k: x.k, p: x.p, f: x.f, c: x.c }, 1));
  EST = [];
  showEst();
  showView("today");
};

/* 歷史紀錄 */
function renderHist() {
  const max = today();
  $("hDate").max = max;
  const d = $("hDate").value || max;
  const L = S.log[d] || [], T = sumList(L), g = calc(S.me);
  $("hSum").innerHTML = `<div class="big">${Math.round(T.k)} <span class="mute">大卡／目標 ${g.kcal}</span></div><div class="mute">蛋白質 ${Math.round(T.p)} g・脂肪 ${Math.round(T.f)} g・碳水 ${Math.round(T.c)} g</div>`;
  $("hLog").innerHTML = renderMealSection(d, false);

  const days = Object.keys(S.log).filter(k => (S.log[k] || []).length && k <= max).sort().reverse();
  $("hDays").innerHTML = days.length ? days.map(k => `<div class="item" data-d="${k}" style="cursor:pointer"><span>${k}</span><span>${Math.round(sumList(S.log[k]).k)} 大卡</span></div>`).join("") : '<div class="mute">尚無紀錄。</div>';
}
$("hDate").onchange = renderHist;
$("hDays").onclick = e => {
  const r = e.target.closest("[data-d]");
  if (r) { $("hDate").value = r.dataset.d; renderHist(); }
};

function getAllFoodOptions() {
  const list = [];
  (S.customFavorites || []).forEach(f => {
    list.push([f.name, f.basis || "1份", f.k, f.p, f.f, f.c, "我的常用清單"]);
  });
  return list.concat(BASE_CF);
}

function renderFoodDropdown() {
  const all = getAllFoodOptions();
  const groups = {};
  all.forEach(item => {
    const grp = item[6];
    if (!groups[grp]) groups[grp] = [];
    groups[grp].push(item);
  });

  let html = '<option value="">請選擇食物</option>';
  for (const [grpName, items] of Object.entries(groups)) {
    html += `<optgroup label="${esc(grpName)}">`;
    items.forEach(it => {
      html += `<option value="${esc(it[0])}">${esc(it[0])}</option>`;
    });
    html += '</optgroup>';
  }
  $("cfName").innerHTML = html;
}

$("cfName").onchange = () => {
  const val = $("cfName").value;
  const f = getAllFoodOptions().find(x => x[0] === val);
  $("cfUnit").textContent = f ? `每 ${f[1]}：${f[2]} 大卡・蛋白質 ${f[3]} g・脂肪 ${f[4]} g・碳水 ${f[5]} g` : "";
};

$("cfAdd").onclick = () => {
  const val = $("cfName").value;
  const f = getAllFoodOptions().find(x => x[0] === val);
  if (!f) return alert("請先選擇食物");
  addLog({ name: f[0] + "（" + f[1] + "）", k: f[2], p: f[3], f: f[4], c: f[5] }, +$("cfN").value || 1);
  showView("today");
};

/* 手動輸入 + 自動加入常用食物庫 */
$("mAdd").onclick = async () => {
  const k = +$("mK").value, n = $("mName").value.trim();
  if (!n || isNaN(k)) return alert("請填寫品項名稱與熱量");

  const p = +$("mP").value || 0;
  const f = +$("mF").value || 0;
  const c = +$("mC").value || 0;

  addLog({ name: n, k, p, f, c }, 1);

  // 若勾選存入常用食物庫
  if ($("mSaveFavorite").checked) {
    if (!S.customFavorites.some(item => item.name === n)) {
      const newFav = { name: n, basis: "1份", k, p, f, c };
      S.customFavorites.unshift(newFav);
      save();
      renderFoodDropdown();

      if (sbClient && currentUser) {
        try {
          await sbClient.from('custom_foods').upsert([{
            barcode: "custom_" + Date.now(),
            name: n,
            basis: "1份",
            kcal: k,
            protein: p,
            fat: f,
            carbs: c,
            created_by: currentUser.id
          }]);
        } catch(err) {}
      }
    }
  }

  ["mName", "mK", "mP", "mF", "mC"].forEach(i => {
    const el = $(i);
    if (el) el.value = "";
  });
  showView("today");
};

window.addEventListener("DOMContentLoaded", () => {
  initSupabase();
});
